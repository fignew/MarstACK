name: MarstACK
version: 0.3.0
slug: marstack
description: Keep your Marstek battery operational without cloud access
url: https://github.com/fignew/MarstACK
arch:
  - amd64
  - aarch64
  - armv7
startup: application
boot: auto
# The battery contacts eu.hamedata.com on plain HTTP port 80, so the add-on
# must listen on port 80 itself. Home Assistant does not allow add-ons to map
# privileged host ports, so we share the host network instead and let the
# server bind port 80 directly. Port 80 must therefore be unused on the host
# (disable conflicting add-ons such as the Nginx Proxy Manager add-on).
host_network: true
options:
  log_level: info
schema:
  log_level: list(error|info|debug)
