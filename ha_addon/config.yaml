name: MarstACK
version: 0.3.8
slug: marstack
description: Keep your Marstek battery operational without cloud access
url: https://github.com/fignew/MarstACK
arch:
  - amd64
  - aarch64
  - armv7
startup: application
boot: auto
# The battery contacts eu.hamedata.com on plain HTTP port 80, so the add-on
# must listen on port 80 itself. Home Assistant does not allow add-ons to map
# privileged host ports, so we share the host network instead and let the
# server bind port 80 directly. Port 80 must therefore be unused on the host
# (disable conflicting add-ons such as the Nginx Proxy Manager add-on).
host_network: true
options:
  log_level: info
  # IANA zone name for the date endpoint (pytz resolves it internally,
  # no system tzdata needed). Examples: Europe/Berlin, UTC
  timezone: UTC
  # Optional redirect target for the landing page, e.g. the Home
  # Assistant web UI (https://homeassistant.local:8123). Leave empty to
  # keep the built-in status page.
  redirect_url: ""
  # Optional catch-all forwarder: any request MarstACK does not serve
  # itself is proxied to this URL, e.g. https://127.0.0.1:443 to hand
  # other port-80 traffic (such as Ecowitt weather gateway webhooks) to
  # the Home Assistant web UI on the same host. Leave empty to disable.
  # TLS to the target is always used but its certificate is never
  # verified (the target is normally addressed by loopback/IP, where the
  # certificate name cannot match anyway).
  forward_url: ""
schema:
  log_level: list(error|info|debug)
  timezone: str
  redirect_url: str?
  forward_url: str?
